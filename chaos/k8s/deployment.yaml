apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-chaos
  namespace: kubeheal-system
  labels:
    app: kubeheal-chaos
    app.kubernetes.io/part-of: kubeheal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeheal-chaos
  template:
    metadata:
      labels:
        app: kubeheal-chaos
    spec:
      serviceAccountName: kubeheal-chaos
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: chaos
          image: kubeheal-chaos:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: SIMULATOR_URL
              value: http://kubeheal-sim.kubeheal-system.svc.cluster.local
            # Persistence is a PVC once the cluster gate lands; until then the
            # document store lives on the container filesystem and is lost on
            # reschedule, which the restart reconciliation tolerates.
            - name: CHAOS_DB_PATH
              value: /app/data/chaos.db
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
