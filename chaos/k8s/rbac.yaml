apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeheal-chaos
  namespace: kubeheal-system
  labels:
    app.kubernetes.io/name: kubeheal-chaos
    app.kubernetes.io/part-of: kubeheal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeheal-chaos
  namespace: kubeheal-system
rules:
  # Exactly the three fault kinds this service can inject. No pods, no exec,
  # no arbitrary resources: the write path is bounded by the API group below.
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaos", "networkchaos", "iochaos"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeheal-chaos
  namespace: kubeheal-system
subjects:
  - kind: ServiceAccount
    name: kubeheal-chaos
    namespace: kubeheal-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeheal-chaos
