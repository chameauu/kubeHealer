# The workload the demo faults. It is a plain Deployment plus a Service: the
# graph emits one node per Service, so without the Service a fault against this
# workload would have nothing to match and blast radius would stay empty.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-target
  namespace: kubeheal-system
  labels:
    app: demo-target
    app.kubernetes.io/part-of: kubeheal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-target
  template:
    metadata:
      labels:
        app: demo-target
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: demo-target
          image: kubeheal-sim:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-target
  namespace: kubeheal-system
  labels:
    app: demo-target
    app.kubernetes.io/part-of: kubeheal
spec:
  selector:
    app: demo-target
  ports:
    - name: http
      port: 80
      targetPort: http
