apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-agent
  namespace: kubeheal-system
  labels:
    app: kubeheal-agent
    app.kubernetes.io/part-of: kubeheal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeheal-agent
  template:
    metadata:
      labels:
        app: kubeheal-agent
    spec:
      # The write path patches Deployments; RBAC for this identity is in rbac.yaml.
      serviceAccountName: kubeheal-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Incident memory and the LangGraph checkpoints both live on the PVC, so
        # a pending approval survives a pod restart and can still be resumed.
        fsGroup: 1000
      containers:
        - name: agent
          image: kubeheal-agent:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: AGENT_DB_PATH
              value: /data/memory.db
            - name: AGENT_CHECKPOINT_PATH
              value: /data/checkpoints.db
            # The authored cassette ships inside the image; the path is relative
            # to the working directory, /app.
            - name: AGENT_CASSETTE_PATH
              value: fixtures/diagnosis-cassette.json
            # Offline default: the stub needs no key, so the image starts even
            # when no secret exists. A cluster that wants live diagnosis supplies
            # the kubeheal-llm secret below; its LLM_PROVIDER (for example
            # azure-v1) takes precedence over this value. Base URL, model and key
            # travel together in that secret, so no tenant endpoint or credential
            # is ever committed here.
            - name: LLM_MODE
              value: stub
            - name: GRAPH_URL
              value: http://kubeheal-graph.kubeheal-system.svc.cluster.local
            - name: FAULTLIB_URL
              value: http://kubeheal-faultlib.kubeheal-system.svc.cluster.local
            - name: CHAOS_URL
              value: http://kubeheal-chaos.kubeheal-system.svc.cluster.local
          envFrom:
            - secretRef:
                name: kubeheal-llm
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubeheal-agent-data
