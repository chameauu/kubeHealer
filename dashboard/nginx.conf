worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # The image runs as a non-root user; every writable temp path lives in /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cluster DNS. Service names are resolved at request time through variables,
    # so the console starts even when a service is not up yet.
    #
    # nginx requires an IP here, not a name: given a name it tries to resolve the
    # resolver itself before it is running, and refuses to start. The entrypoint
    # substitutes the pod's own nameserver for __KUBE_DNS__.
    resolver __KUBE_DNS__ valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # A proxied failure is returned in the same envelope the services use,
        # instead of an nginx HTML page.
        error_page 502 = @api_bad_gateway;
        error_page 504 = @api_timeout;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Each prefix is stripped before the request reaches the service.
        location /api/chaos/ {
            set $chaos_upstream kubeheal-chaos.kubeheal-system.svc.cluster.local;
            rewrite ^/api/chaos/(.*)$ /$1 break;
            proxy_pass http://$chaos_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        location /api/graph/ {
            set $graph_upstream kubeheal-graph.kubeheal-system.svc.cluster.local;
            rewrite ^/api/graph/(.*)$ /$1 break;
            proxy_pass http://$graph_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/faultlib/ {
            set $faultlib_upstream kubeheal-faultlib.kubeheal-system.svc.cluster.local;
            rewrite ^/api/faultlib/(.*)$ /$1 break;
            proxy_pass http://$faultlib_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/agent/ {
            set $agent_upstream kubeheal-agent.kubeheal-system.svc.cluster.local;
            rewrite ^/api/agent/(.*)$ /$1 break;
            proxy_pass http://$agent_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            # Approving resumes the run and verification can poll for 60 s.
            proxy_read_timeout 120s;
        }

        location /api/sim/ {
            set $sim_upstream kubeheal-sim.kubeheal-system.svc.cluster.local;
            rewrite ^/api/sim/(.*)$ /$1 break;
            proxy_pass http://$sim_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            default_type application/json;
            return 404 '{"detail":"unknown api prefix"}';
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }

        location @api_bad_gateway {
            default_type application/json;
            return 502 '{"detail":"the service is unreachable from the console proxy"}';
        }

        location @api_timeout {
            default_type application/json;
            return 504 '{"detail":"the service did not answer before the console proxy timeout"}';
        }
    }
}
