apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeheal-graph
  namespace: kubeheal-system
  labels:
    app.kubernetes.io/name: kubeheal-graph
    app.kubernetes.io/part-of: kubeheal
---
# Read-only, cluster-wide: the graph is only useful if it can see every
# namespace a workload depends on. No writes, no exec, no secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeheal-graph-read
  labels:
    app.kubernetes.io/name: kubeheal-graph
    app.kubernetes.io/part-of: kubeheal
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeheal-graph-read
  labels:
    app.kubernetes.io/name: kubeheal-graph
    app.kubernetes.io/part-of: kubeheal
subjects:
  - kind: ServiceAccount
    name: kubeheal-graph
    namespace: kubeheal-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeheal-graph-read
