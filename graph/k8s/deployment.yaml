apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-graph
  namespace: kubeheal-system
  labels:
    app: kubeheal-graph
    app.kubernetes.io/part-of: kubeheal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeheal-graph
  template:
    metadata:
      labels:
        app: kubeheal-graph
    spec:
      serviceAccountName: kubeheal-graph
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: graph
          image: kubeheal-graph:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            # Read the real cluster: blast radius must describe the workload
            # that is actually being faulted. There is no Hubble install here,
            # so topology_sources honestly reports ["kubernetes"] and no flow
            # edges are invented. Flip to "true" only to show the labelled
            # synthetic fixture in kubeheal-demo.
            - name: LOCAL_DEMO
              value: "false"
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
