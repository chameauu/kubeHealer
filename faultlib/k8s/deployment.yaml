apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeheal-faultlib
  namespace: kubeheal-system
  labels:
    app: kubeheal-faultlib
    app.kubernetes.io/part-of: kubeheal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeheal-faultlib
  template:
    metadata:
      labels:
        app: kubeheal-faultlib
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: faultlib
          image: kubeheal-faultlib:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            # The catalogue refuses to offer a fault it cannot inject, so it
            # has to know where the chaos service answers.
            - name: CHAOS_URL
              value: http://kubeheal-chaos.kubeheal-system.svc.cluster.local
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
